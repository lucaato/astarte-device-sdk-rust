[package]
name = "astarte-device-sdk-tls"
version.workspace = true
categories = ["embedded", "api-bindings"]
documentation = "https://docs.rs/astarte-device-sdk-derive"
edition.workspace = true
homepage.workspace = true
keywords = ["sdk", "iot", "astarte", "tls"]
license.workspace = true
readme = "README.md"
repository.workspace = true
rust-version.workspace = true
description = "Share the same tls client configuration between crates"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
default = ["platform-verifier"]
# Preferred, use the platform certificate and TLS verifier.
platform-verifier = ["dep:rustls-platform-verifier"]
# Compiled in copy of the root certificate trusted by Mozilla.
webpki-roots = ["dep:webpki-roots"]

[dependencies]
cfg-if.workspace = true
rustls.workspace = true
rustls-native-certs.workspace = true
rustls-platform-verifier = { workspace = true, optional = true }
tracing.workspace = true
webpki-roots = { workspace = true, optional = true }

